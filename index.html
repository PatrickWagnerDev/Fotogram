<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogram</title>
    <link rel="shortcut icon" href="./assets/icon/Fotogram_Logo.png" type="image/x-icon">

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="style.css">

</head>

<body onload="init()">
    <header class="HeaderSection">
        <img src="./assets/icon/Fotogram_Logo_Text.png" alt="Fotogram Logo and Title">
    </header>
    <main class="MainSection">
        <h1>
            Your personal photo album
        </h1>
        <section class="ThumbnailSection" id="Thumbnails"></section>
    </main>
    <dialog class="DialogSection" id="ImageDialog" onclick="closeImageDialog()">
        <main class="DialogContainer" onclick="stopBubblingDialog(event)">
            <header class="DialogHeader">
                <h2 class="ImageTitle" id="ImageName"></h2>
                <img aria-label="Close Button" class="CloseButton" onclick="closeImageDialog()" tabindex="0"
                    alt="Close Button">
            </header>
            <figure class="DialogImage" id="ImageID"> </figure>
            <footer class="DialogFooter" id="FooterDialog">
                <img aria-label="Previous Foto Button" class="PreviousArrow" onclick="previousImage()" tabindex="0"
                    alt="Previous Foto Button">
                <p class="CounterStyle" id="ImageCounter"></p>
                <img aria-label="Next Foto Button" class="NextArrow" onclick="nextImage()" tabindex="0"
                    alt="Next Foto Button">
            </footer>
        </main>
    </dialog>
    <footer class="FooterSection">
        <section class="DALogo">
            <img src="./assets/icon/DA_Logo.png" alt="Developer Akademie Logo">
            <img src="./assets/icon/DA_Logo_Text.png" alt="Developer Akademie">
        </section>
        <p>
            &copy; 2023 Developer Akademie GmbH
        </p>
    </footer>
</body>

<script src="./scripts/html_templates.js"></script>
<script src="script.js"></script>

</html>
